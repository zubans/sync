# Сервер Contact Sync и PostgreSQL. Управление — через make (см. make help).
# Секреты берутся из .env в корне проекта (создаётся командой make init).

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Запустите make init}
    healthcheck:
      test: ["CMD", "pg_isready", "-d", "app", "-U", "app"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - database_data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build:
      context: ./server
      target: prod
    depends_on:
      database:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?Запустите make init}
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@database:5432/app?serverVersion=16&charset=utf8
      APK_STORAGE_DIR: /app/var/storage/apk
      DEFAULT_URI: http://localhost:${HTTP_PORT:-8001}
    ports:
      - "${HTTP_PORT:-8001}:80"
    volumes:
      - apk_storage:/app/var/storage
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # Сбор новостей раз в 5 минут (app:news:collect), полные тексты статей (app:news:articles), перевод новостей
  # изданий на других языках (app:news:translate), сюжетные линии (app:news:analyze), последствия для Мосбиржи
  # (app:news:market), анализ инструментов виджета Мосбиржи (app:market:analyze) и сводки за час и за сутки
  # (app:news:digest; перевод, последствия, анализ и сводки — Antigravity CLI,
  # вход один раз: make agy-login). Тот же образ, что у сервера; миграции
  # применяет контейнер app — пока они не применены, проход пропускается без ошибок в журнале.
  news:
    build:
      context: ./server
      target: prod
    depends_on:
      app:
        condition: service_started
    environment:
      APP_ENV: prod
      APP_SECRET: ${APP_SECRET:?Запустите make init}
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@database:5432/app?serverVersion=16&charset=utf8
      # Модели agy для сводок — названия из `agy models`; пусто — модель по умолчанию.
      NEWS_DIGEST_MODEL_HOUR: ${NEWS_DIGEST_MODEL_HOUR:-}
      NEWS_DIGEST_MODEL_DAY: ${NEWS_DIGEST_MODEL_DAY:-}
      # Запасные модели agy по порядку: у каждой своя квота — кончилась модель сводки, запрос идёт следующей того же аккаунта.
      NEWS_AGY_FALLBACK_MODELS: ${NEWS_AGY_FALLBACK_MODELS:-Claude Sonnet 4.6 (Thinking),Claude Opus 4.6 (Thinking),GPT-OSS 120B (Medium)}
      # Модель agy для анализа инструментов Мосбиржи; пусто — модель по умолчанию с --effort medium.
      MARKET_ANALYSIS_MODEL: ${MARKET_ANALYSIS_MODEL:-}
      # Векторы новостей для сюжетных линий: Ollama с qwen3-embedding на машине с видеокартой — та же, что у KB.
      NEWS_EMBEDDINGS_URL: ${NEWS_EMBEDDINGS_URL:-http://192.168.1.133:11434}
      NEWS_EMBEDDINGS_MODEL: ${NEWS_EMBEDDINGS_MODEL:-qwen3-embedding:4b}
    volumes:
      - agy_data:/app/var/agy
    command:
      - sh
      - -c
      - |
        while :; do
          if php bin/console doctrine:migrations:up-to-date -q; then
            php bin/console app:news:collect --no-interaction
            php bin/console app:news:articles --no-interaction
            php bin/console app:news:translate --no-interaction
            php bin/console app:news:analyze --no-interaction
            php bin/console app:news:market --no-interaction
            php bin/console app:market:analyze --no-interaction
            php bin/console app:news:digest --no-interaction
          else
            echo "Миграции ещё не применены — сбор пропущен"
          fi
          sleep 300
        done
    restart: unless-stopped

  # Перевод статей по кнопке «Перевести» на планшете и в виджете — приоритетная очередь: проверяется каждые 5 секунд,
  # не дожидаясь пятиминутного цикла news. Тот же образ, переменные и вход в agy (аккаунты и их отдых — общие).
  translate:
    extends: news
    command:
      - sh
      - -c
      - |
        while :; do
          if php bin/console doctrine:migrations:up-to-date -q; then
            php bin/console app:news:translate-requested --no-interaction
          fi
          sleep 5
        done

  # Резервные копии на Яндекс.Диск и шару в локальной сети (схема — как у бекапа KB): не работает постоянно, запускается make backup
  # и make backup-db из cron хоста. Папка проекта, хранилище и rclone.conf пользователя хоста (remote yandex, общий
  # с бекапами KB и trash) — только на чтение; хранилище на запись открывает только make restore-files
  backup:
    build: ./docker/backup
    image: sync-backup
    profiles: [backup]
    env_file: .env
    environment:
      # слоты daily/<день>, hours/<час> — по московскому времени, как у бекапа KB
      TZ: ${BACKUP_TZ:-Europe/Moscow}
    volumes:
      - ${BACKUP_DIR:-~/backups/sync}:/backup
      - ${BACKUP_RCLONE_DIR:-~/.config/rclone}:/rclone:ro
      - .:/src:ro
      - apk_storage:/storage:${BACKUP_STORAGE_MODE:-ro}
      - agy_data:/agy:ro
      # шара D: компьютера 192.168.1.133 (вторая копия): тот же путь, что на хосте; rslave — чтобы automount
      # хоста, сработавший уже после старта контейнера, был виден и в нём
      - ${BACKUP_LAN_MOUNT:-/media/share}:${BACKUP_LAN_MOUNT:-/media/share}:rslave
    depends_on:
      - database

volumes:
  agy_data:
  database_data:
  apk_storage:
  caddy_data:
  caddy_config:
