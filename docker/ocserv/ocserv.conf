# Стартовый конфиг ocserv. Фактический конфиг пересоздаётся entrypoint.sh
# из переменных окружения (см. compose.yaml и docs/ocserv.md) при каждом старте.

auth = "plain[passwd=/etc/ocserv/ocpasswd]"
tcp-port = 443
udp-port = 443
run-as-user = ocserv
run-as-group = ocserv
socket-file = /run/ocserv.socket
server-cert = /etc/ocserv/certs/server-cert.pem
server-key = /etc/ocserv/certs/server-key.pem
ca-cert = /etc/ocserv/certs/ca.pem
isolate-workers = true
max-clients = 16
max-same-clients = 4
keepalive = 32400
dpd = 90
mobile-dpd = 1800
switch-to-tcp-timeout = 25
try-mtu-discovery = true
auth-timeout = 240
min-reauth-time = 300
max-ban-score = 50
ban-reset-time = 300
cookie-timeout = 300
deny-roaming = false
rekey-time = 172800
rekey-method = ssl
use-utmp = false
use-occtl = true
pid-file = /run/ocserv.pid
device = vpn
predictable-ips = true
ipv4-network = 10.45.0.0
ipv4-netmask = 255.255.255.0
dns = 1.1.1.1
dns = 8.8.8.8
no-route = 192.168.0.0/16
no-route = 10.0.0.0/8
no-route = 172.16.0.0/12
no-route = 100.64.0.0/10