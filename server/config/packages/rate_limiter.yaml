framework:
    rate_limiter:
        # Попытки входа в API: по паре IP+email.
        api_login:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        # Регистрация: по IP.
        api_register:
            policy: sliding_window
            limit: 10
            interval: '1 hour'

when@test:
    framework:
        rate_limiter:
            api_login:
                policy: no_limit
            api_register:
                policy: no_limit
